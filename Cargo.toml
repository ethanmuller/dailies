[package]
name = "dailies"
version = "0.1.0"
edition = "2021"
default-run = "main"

[dependencies]
nannou = "0.19.0"
nannou_osc = "0.19.0"
gilrs = {version = "0.11.0", default-features = false, features = ["xinput"]}

[workspace]
members = [
]

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "flocking"
path = "src/flocking.rs"

[[bin]]
name = "controller_test"
path = "src/controller_test.rs"

[[bin]]
name = "joy_to_osc"
path = "src/joy_to_osc.rs"

